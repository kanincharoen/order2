<div class="menu-container">
  <header class="menu-header">
    <h1>Menu Management</h1>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon> Add Menu Item
    </button>
  </header>

  <div *ngFor="let category of categories" class="category-section">
    <h2>{{ category }}</h2>
    <div class="menu-grid">
      <mat-card
        *ngFor="let item of getItemsByCategory(category)"
        [ngClass]="{ 'unavailable': !item.isAvailable }"
      >
        <mat-card-header>
          <mat-card-title>{{ item.name }}</mat-card-title>
          <mat-card-subtitle>${{ item.price }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p>{{ item.description }}</p>
        </mat-card-content>
        <mat-card-actions>
          <mat-slide-toggle
            [checked]="item.isAvailable"
            (change)="toggleAvailability(item)"
            [attr.aria-label]="'Toggle availability for ' + item.name"
          >
            {{ item.isAvailable ? 'Available' : 'Unavailable' }}
          </mat-slide-toggle>
          <button mat-icon-button (click)="editItem(item)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteItem(item)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>
