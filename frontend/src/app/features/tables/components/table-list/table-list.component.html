<div class="tables-container">
  <header class="tables-header">
    <h1>Table Management</h1>
    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon> Add Table
    </button>
  </header>

  <div class="status-summary" *ngIf="summary">
    <mat-chip-set>
      <mat-chip class="chip-available">Available: {{ summary.available }}</mat-chip>
      <mat-chip class="chip-occupied">Occupied: {{ summary.occupied }}</mat-chip>
      <mat-chip class="chip-reserved">Reserved: {{ summary.reserved }}</mat-chip>
      <mat-chip class="chip-cleaning">Needs Cleaning: {{ summary.needsCleaning }}</mat-chip>
      <mat-chip>Total: {{ summary.total }}</mat-chip>
    </mat-chip-set>
  </div>

  <div class="tables-grid">
    <mat-card *ngFor="let table of tables" [ngClass]="'table-card status-' + table.status">
      <mat-card-header>
        <mat-card-title>Table {{ table.tableNumber }}</mat-card-title>
        <mat-card-subtitle>Capacity: {{ table.seatingCapacity }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <span class="status-badge" [ngClass]="'badge-' + table.status">
          {{ formatStatus(table.status) }}
        </span>
      </mat-card-content>
      <mat-card-actions>
        <button
          mat-button
          *ngFor="let transition of getValidTransitions(table.status)"
          (click)="changeStatus(table, transition)"
        >
          {{ formatStatus(transition) }}
        </button>
        <button mat-icon-button (click)="editTable(table)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteTable(table)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
