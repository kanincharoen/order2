<div class="orders-container">
  <header class="orders-header">
    <h1>Active Orders</h1>
  </header>

  <div class="orders-grid">
    <mat-card *ngFor="let order of orders" [ngClass]="'order-card status-' + order.status">
      <mat-card-header>
        <mat-card-title>Table {{ order.tableNumber }}</mat-card-title>
        <mat-card-subtitle>
          {{ order.itemCount }} item(s) &middot; ${{ order.totalPrice }}
        </mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <span class="status-badge" [ngClass]="'badge-' + order.status">
          {{ formatStatus(order.status) }}
        </span>
        <p class="elapsed-time">Created: {{ order.createdAt | date:'short' }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button
          mat-button
          *ngFor="let transition of getValidTransitions(order.status)"
          (click)="changeStatus(order, transition)"
        >
          &rarr; {{ formatStatus(transition) }}
        </button>
      </mat-card-actions>
    </mat-card>
  </div>

  <div *ngIf="orders.length === 0" class="empty-state">
    <mat-icon>restaurant</mat-icon>
    <p>No active orders</p>
  </div>
</div>
